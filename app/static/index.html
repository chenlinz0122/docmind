<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocMind · 文档问答</title>
<style>
  :root { --fg:#1b1b1f; --muted:#6b6b76; --line:#e4e4ec; --bg:#f7f7f9; --accent:#2f6df6; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--fg); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:18px 24px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:13px; color:var(--muted); }
  main { max-width:880px; margin:0 auto; padding:22px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h2 { margin:0 0 12px; font-size:13px; letter-spacing:.04em; color:var(--muted); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type=text], input[type=file], textarea, button { font:inherit; }
  input[type=text], textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:76px; resize:vertical; }
  button { padding:9px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--muted); border:1px solid var(--line); }
  button:disabled { opacity:.55; cursor:default; }
  .docs { display:grid; gap:8px; }
  .doc { display:flex; justify-content:space-between; gap:12px; align-items:center; font-size:13px; border-left:3px solid var(--line); padding:6px 10px; }
  .doc small { color:var(--muted); }
  .answer { white-space:pre-wrap; }
  .cites { display:grid; gap:8px; margin-top:12px; }
  .cite { font-size:13px; border-left:3px solid var(--accent); background:#f4f7ff; padding:6px 10px; border-radius:0 8px 8px 0; }
  .cite b { color:var(--accent); }
  .meta { font-size:12px; color:var(--muted); margin-top:8px; }
  .hint { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>DocMind</h1>
  <p>上传 PDF / TXT / MD → 建索引 → 提问，回答带「文档 + 页码 + 片段」引用</p>
</header>
<main>
  <div class="panel">
    <h2>上传文档</h2>
    <div class="row">
      <input type="file" id="file" accept=".pdf,.txt,.md" />
      <input type="text" id="title" placeholder="标题（可留空，默认用文件名）" style="flex:1;min-width:200px" />
      <button id="upload">上传并建库</button>
    </div>
    <div class="hint" style="margin-top:8px">支持 20MB 以内的 PDF / TXT / MD；扫描件没有文本层，需要先 OCR。</div>
  </div>

  <div class="panel">
    <h2>知识库</h2>
    <div class="docs" id="docs"><div class="hint">还没有文档，先上传一份。</div></div>
  </div>

  <div class="panel">
    <h2>提问</h2>
    <textarea id="q" placeholder="例如：这份文档里 Redis 的淘汰策略是怎么说的？"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="ask">提问</button>
    </div>
  </div>

  <div class="panel" id="result" style="display:none">
    <h2>回答</h2>
    <div class="answer" id="answer"></div>
    <div class="cites" id="cites"></div>
    <div class="meta" id="meta"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function loadDocs() {
  const data = await (await fetch("/api/docs")).json();
  const box = $("docs");
  if (!data.docs.length) { box.innerHTML = '<div class="hint">还没有文档，先上传一份。</div>'; return; }
  box.innerHTML = data.docs.map((d) =>
    `<div class="doc"><span>${d.title} <small>${d.pages} 页 / ${d.chunks} 块</small></span>
     <button class="ghost" data-id="${d.doc_id}">删除</button></div>`).join("");
  box.querySelectorAll("button").forEach((b) => {
    b.onclick = async () => { await fetch(`/api/docs/${b.dataset.id}`, { method: "DELETE" }); loadDocs(); };
  });
}

$("upload").onclick = async () => {
  const file = $("file").files[0];
  if (!file) return;
  const form = new FormData();
  form.append("file", file);
  if ($("title").value.trim()) form.append("title", $("title").value.trim());
  $("upload").disabled = true;
  try {
    const res = await fetch("/api/docs", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) { alert(data.detail || "上传失败"); return; }
    $("file").value = ""; $("title").value = "";
    loadDocs();
  } finally { $("upload").disabled = false; }
};

$("ask").onclick = async () => {
  const question = $("q").value.trim();
  if (!question) return;
  $("ask").disabled = true;
  try {
    const data = await (await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    })).json();
    $("result").style.display = "block";
    $("answer").textContent = data.answer;
    $("cites").innerHTML = (data.citations || []).map((c) =>
      `<div class="cite"><b>${c.title} · 第 ${c.page} 页 · ${c.chunk_id}</b><br>${c.snippet}…</div>`).join("");
    $("meta").textContent = `abstained=${data.abstained} · reason=${data.reason} · ${data.elapsed_ms}ms`;
  } finally { $("ask").disabled = false; }
};

loadDocs();
</script>
</body>
</html>
